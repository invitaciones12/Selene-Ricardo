<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Invitaciones | Selene & Ricardo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5c4033; /* Dark Brown */
            --accent: #d4af37; /* Gold */
            --bg: #f9f6f0; /* Beige */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(var(--accent) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(92, 64, 51, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.4);
            width: 100%;
            max-width: 500px;
            position: relative;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px dashed rgba(212, 175, 55, 0.5);
            border-radius: 8px;
            pointer-events: none;
        }
        h1 { 
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem; 
            text-align: center; 
            color: var(--primary); 
            margin-bottom: 25px; 
        }
        .form-group { margin-bottom: 20px; position: relative; z-index: 2; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--primary); }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            background: #faf8f5;
        }
        input:focus { outline: none; border-color: var(--accent); background: #fff; }
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            position: relative;
            z-index: 2;
        }
        button:hover { background: #4a332a; }
        button:active { transform: scale(0.98); }
        
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background: #faf8f5;
            border: 1px dashed var(--accent);
            border-radius: 8px;
            display: none;
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .result-box p { font-size: 0.85rem; color: var(--primary); margin-bottom: 10px; font-weight: bold; }
        .link-output {
            word-break: break-all;
            color: #333; 
            font-weight: 500;
            margin-bottom: 15px;
            background: #fff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
            font-size: 0.9rem;
            text-align: left;
        }
        .share-btn {
            background: var(--accent);
            padding: 12px 15px;
            font-size: 0.95rem;
        }
        .share-btn:hover { background: #b5952f; }

        .status-msg {
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #2e7d32;
            display: none;
        }

        .error-msg {
            color: #c62828;
            font-size: 0.85rem;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ Generador VIP</h1>

        <div class="form-group">
            <label for="guest-name">Nombre del Invitado/Familia</label>
            <input type="text" id="guest-name" placeholder="Ej. Familia Pérez">
        </div>
        <div class="error-msg" id="error-msg">⚠️ Por favor, ingresa el nombre del invitado.</div>

        <div class="form-group">
            <label for="guest-passes">Número de Pases / Invitados (Opcional)</label>
            <input type="number" id="guest-passes" placeholder="Ej. 2" min="1">
        </div>

        <div class="form-group">
            <label for="table-num">Número de Mesa (Opcional)</label>
            <input type="number" id="table-num" placeholder="Ej. 5">
        </div>

        <button onclick="generateLink()">Generar Link 🔗</button>

        <div class="result-box" id="result-box">
            <p>Link generado: ✨</p>
            <div class="link-output" id="link-output"></div>
            <button class="share-btn" onclick="shareLink()">Compartir Invitación 📤</button>
            <div class="status-msg" id="status-msg">¡Enlace copiado al portapapeles! 📋</div>
        </div>
    </div>

    <script>
        // Ocultar la caja de resultados (y el botón de compartir) si se modifica algún campo
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('result-box').style.display = 'none';
                document.getElementById('status-msg').style.display = 'none';
            });
        });

        async function generateLink() {
            const baseUrl = "https://invitaciones12.github.io/Selene-Ricardo";
            const nameInput = document.getElementById('guest-name');
            const errorMsg = document.getElementById('error-msg');
            const linkOutput = document.getElementById('link-output');
            const resultBox = document.getElementById('result-box');
            
            const name = nameInput.value.trim();
            const passes = document.getElementById('guest-passes').value.trim();
            const table = document.getElementById('table-num').value.trim();

            if (!name) {
                errorMsg.style.display = 'block';
                nameInput.style.borderColor = '#c62828';
                resultBox.style.display = 'none';
                return;
            }

            errorMsg.style.display = 'none';
            nameInput.style.borderColor = '#e2e8f0';

            // Build query params
            const params = new URLSearchParams();
            params.append('guest', name);
            if (passes) params.append('passes', passes);
            if (table) params.append('table', table);

            const finalUrl = `${baseUrl}/index.html?${params.toString()}`;
            
            // Show loading state in UI
            linkOutput.innerText = "Generando link corto... ⏳";
            resultBox.style.display = 'block';
            document.getElementById('status-msg').style.display = 'none';

            let urlToShare = finalUrl; // Default to long URL if shortening fails

            // Try to shorten the URL via zip1.io
            try {
                const response = await fetch('https://zip1.io/api/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: finalUrl })
                });

                if (response.ok) {
                    const data = await response.json();
                    // Grab the shortened URL (fallback to long url if unexpected JSON structure)
                    urlToShare = data.short_url || data.url || data.link || finalUrl;
                } else {
                    console.warn("Zip1 API rate limited or failed. Falling back to long URL. ⚠️");
                }
            } catch (error) {
                console.error("Network error shortening URL. Falling back to long URL. 💥", error);
            }

            // Update the UI with whichever URL we ended up with
            linkOutput.innerText = urlToShare;
        }

        async function shareLink() {
            const textToShare = document.getElementById('link-output').innerText;
            // Bug fix: Appended the actual link to the share message! 🛠️
            const shareMessage = `Te invito a la boda de Selene y Ricardo: ${textToShare}`;
            const statusMsg = document.getElementById('status-msg');

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Boda Selene & Ricardo',
                        text: 'Te invito a la boda de Selene y Ricardo: ',
                        url: textToShare
                    });
                } catch (err) {
                    console.warn("Share cancelled or failed.", err);
                }
            } else {
                // Fallback for desktop or unsupported browsers
                navigator.clipboard.writeText(shareMessage).then(() => {
                    statusMsg.style.display = 'block';
                });
            }
        }
    </script>
</body>
</html>
